#Waster Trade Caravan

- type: entity
  id: TrademachineWaster
  parent: Trademachine
  abstract: true
  name: Waster Caravan Wagon
  description: A caravan operated by Wastelanders, offering goods from all across the wastes.
  components:
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: NcStoreStructuredBoundUi
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        density: 300
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/caravanwagon.rsi
    layers:
    - state: caravanwagon
  - type: PointLight
    enabled: false

- type: entity
  id: TrademachineWasterCity
  parent: TrademachineWaster
  name: Waster Caravan Wagon
  description: A caravan operated by Wastelanders, offering goods from all across the wastes.
  suffix: vendor, normal
  components:
  - type: NcStore
    buyPresets:
    - Waster_Buy2
    sellPresets:
    - Waster_Sell2
    contractPresets:
    - PresetBazar
  # #Misfits Change — restored TownieShopkeeper access restriction (players must be shopkeeper to use terminal)
  # #Misfits Add — track Hall of Fame roster for the tier contract system
  - type: AccessReader
    access:
    - [ "WasterTrader" ]
  - type: NcContractRoster


- type: entity
  id: N14BaseMagazine5mmMinigun
  name: minigun magazine (5mm)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - N14MagazineMinigun5mm
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14CartridgePistol5
    capacity: 500 # #Burger - prior proposed round increase (was 200)
  - type: Item # #Burger - larger profile in bag to make up for capacity increase
    size: Large
    shape:
    - 0,0,2,2
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/5mm/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  id: N14MagazineMinigun5mm
  name: minigun box (5mm)
  parent: N14BaseMagazine5mmMinigun
  components:
  - type: BallisticAmmoProvider
    proto: N14CartridgePistol5

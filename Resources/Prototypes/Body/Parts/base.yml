- type: entity
  id: BasePart
  parent: BaseItem
  name: "body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: OrganicPart # Shitmed Change
  # Wound state is sent through Appearance to the client visualizer.
  - type: Appearance
  # Goob Shitmed wound-data baseline. Concrete species can override these
  # values, but every normal organic limb must participate in the wound graph.
  - type: Woundable
    damageContainer: OrganicPart
    integrity: 80
    integrityCap: 80
    thresholds:
      Minor: 70
      Moderate: 50
      Severe: 25
      Critical: 10
      Mangled: 0
  - type: BodyPart
    severIntegrity: 150  # Misfits Change
  - type: Gibbable
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
      - Trash
  # Shitmed Change Start
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/organ1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/organ2.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 200
      behaviors:
      - !type:GibPartBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 250
      behaviors:
      - !type:GibPartBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 250
      behaviors:
      - !type:GibPartBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 250
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
  # Shitmed Change End

- type: entity
  id: BaseTorso
  name: "torso"
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Torso
    # Shitmed Change Start
    toolName: "a torso"
    containerName: "torso_slot"
  - type: Woundable
    integrity: 200
    integrityCap: 200
    thresholds:
      Minor: 180
      Moderate: 120
      Severe: 60
      Critical: 30
      Mangled: 0
  - type: WoundableVisuals
    thresholds: [10, 20, 30, 50, 70, 100]
    occupiedLayer: Chest
    damageOverlayGroups:
      Brute: { sprite: _Shitmed/Mobs/Effects/brute_damage.rsi, color: "#FF0000" }
      Burn: { sprite: _Shitmed/Mobs/Effects/burn_damage.rsi }
    bleedingOverlay: _Shitmed/Mobs/Effects/bleeding_damage.rsi
  - type: ContainerContainer
    containers:
      torso_slot: !type:ContainerSlot {}
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibPartBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 400
      behaviors:
      - !type:GibPartBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 500
      behaviors:
      - !type:GibPartBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    # Shitmed Change End
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 11
    staminaCost: 12

- type: entity
  id: BaseHead
  name: "head"
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Head
    toolName: "a head" # Shitmed Change
    vital: true
    canSever: false # #Misfits Tweak - Disable head severing for all playable mobs
    severIntegrity: 200 # Misfits Change
  - type: Woundable
    boneEntity: BoneNeck
    integrity: 125
    integrityCap: 125
    thresholds:
      Minor: 110
      Moderate: 70
      Severe: 50
      Critical: 20
      Mangled: 0
  - type: WoundableVisuals
    thresholds: [10, 20, 30, 50, 70, 100]
    occupiedLayer: Head
    damageOverlayGroups:
      Brute: { sprite: _Shitmed/Mobs/Effects/brute_damage.rsi, color: "#FF0000" }
      Burn: { sprite: _Shitmed/Mobs/Effects/burn_damage.rsi }
    bleedingOverlay: _Shitmed/Mobs/Effects/bleeding_damage.rsi
  - type: Input
    context: "ghost"
  - type: Tag
    tags:
      - Head
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
    staminaCost: 5


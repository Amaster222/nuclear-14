# #Misfits Add - dedicated NCR Heavy Trooper power armor variants.
# These inherit the stock T-45/T-51 mechanics; only the NCR visuals and attached
# helmet prototypes are selected here so the role does not duplicate old armor stats.

- type: entity
  parent: N14ClothingOuterPowerArmorT45
  id: MisfitsNCRHeavyTrooperPowerArmorT45
  name: NCR Heavy Trooper T-45 Power Armor
  description: A T-45 power armor suit issued to NCR heavy troopers.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_t45.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_t45.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: MisfitsNCRHeavyTrooperT45Helmet
      gloves: N14ClothingPAGauntlets
      shoes: N14ClothingPABoots
      back: N14ClothingPowerSystemsBack

- type: entity
  parent: N14ClothingOuterPowerArmorT51
  id: MisfitsNCRHeavyTrooperLeadPowerArmorT51
  name: NCR Heavy Trooper Lead T-51 Power Armor
  description: A T-51 power armor suit reserved for NCR heavy trooper leadership.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_lead_t51.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_lead_t51.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: MisfitsNCRHeavyTrooperLeadT51Helmet
      gloves: N14ClothingPAGauntlets
      shoes: N14ClothingPABoots
      back: N14ClothingPowerSystemsBack

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorT45NCR
  id: MisfitsNCRHeavyTrooperT45Helmet
  name: NCR Heavy Trooper T-45 Power Armor Helmet
  components:
  - type: Sprite
    netsync: false
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_t45_helmet.rsi
    layers:
    - state: icon
    - state: equipped-HELMET
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorT51NCR
  id: MisfitsNCRHeavyTrooperLeadT51Helmet
  name: NCR Heavy Trooper Lead T-51 Power Armor Helmet
  components:
  - type: Sprite
    netsync: false
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_lead_t51_helmet.rsi
    layers:
    - state: icon
    - state: equipped-HELMET
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET

# X-01 is intentionally not referenced by a job or loadout. It is spawn-menu only.
- type: entity
  parent: N14ClothingOuterPowerArmorAdvanced1
  id: MisfitsNCRX01PowerArmor
  categories: [] # Spawn-menu entity only; not assigned to a job or loadout.
  name: NCR X-01 Power Armor
  description: An NCR-marked X-01 power armor suit.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_x01.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_x01.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: MisfitsNCRX01Helmet
      gloves: N14ClothingPAGauntletsDark
      shoes: N14ClothingPABootsDark
      back: N14ClothingPowerSystemsBack

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorX01
  id: MisfitsNCRX01Helmet
  name: NCR X-01 Power Armor Helmet
  components:
  - type: Sprite
    netsync: false
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_x01_helmet.rsi
    layers:
    - state: icon
    - state: equipped-HELMET
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET

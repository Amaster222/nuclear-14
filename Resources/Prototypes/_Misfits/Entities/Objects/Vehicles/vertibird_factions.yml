# Faction paint schemes inherit the complete Vertibird flight, seating, fuel,
# MultiZ transfer, combat-drop, turret and repair behavior.  Only the RSI and
# its stationary/rotor-animation states differ.

- type: entity
  parent: N14VehicleVertibird
  id: N14VehicleVertibirdBoS
  name: Brotherhood of Steel vertibird
  suffix: Flyable, Wendover
  components:
  - type: Vertibird
    groundedSpriteState: vertibird_bos
    flyingSpriteState: vertibird_bos_flying
  - type: Sprite
    sprite: _Misfits/N14/Objects/Vehicles/vertibird_bos.rsi

- type: entity
  parent: N14VehicleVertibirdWreck
  id: N14VehicleVertibirdBoSWreck
  name: grounded Brotherhood of Steel vertibird
  suffix: Mapping
  components:
  - type: Sprite
    sprite: _Misfits/N14/Objects/Vehicles/vertibird_bos.rsi
    state: vertibird_bos


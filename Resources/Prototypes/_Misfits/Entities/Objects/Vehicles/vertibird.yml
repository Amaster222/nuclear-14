# #Misfits Add: Decorative Vertibird wreck for mapping and scene dressing.

- type: entity
  parent: BaseStructure
  id: N14VehicleVertibirdWreck
  name: grounded vertibird
  description: A grounded pre-War tilt-rotor aircraft with enough bulk to dominate the skyline.
  suffix: Mapping
  components:
  - type: Sprite
    sprite: _Misfits/N14/Objects/Vehicles/vertibird.rsi
    state: vertibird
    drawdepth: Mobs
    noRot: true
    offset: 0, 1.8
    scale: 0.6, 0.6
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.6,-0.6,1.6,0.6"
        density: 100
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseStructureDynamic
  id: N14VehicleVertibird
  name: vertibird
  description: A heavy tilt-rotor aircraft rigged for short-range wasteland flight.
  suffix: Flyable, Wendover
  components:
  - type: Vertibird
    mapConfigId: Wendover
    startupDuration: 35
    hoverAltitude: 0.85
    verticalSpeed: 0.75
    thrustAcceleration: 6
    reverseAcceleration: 2
    maxFlightSpeed: 12
    flightDrag: 0.75
    turnSpeedDegrees: 90
  - type: MZPhysics
    bounciness: 0.05
  - type: Appearance
  - type: InputMover
  - type: MobMover
  - type: CanMoveInAir
  - type: MovementAlwaysTouching
  - type: NoRotateOnMove
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.VertibirdUiKey.Key:
        type: VertibirdBoundUserInterface
  - type: ActivatableUI
    key: enum.VertibirdUiKey.Key
  - type: Sprite
    sprite: _Misfits/N14/Objects/Vehicles/vertibird.rsi
    state: vertibird
    drawdepth: Mobs
    noRot: false
    offset: 0, 1.8
    scale: 0.6, 0.6
  - type: Strap
    position: Stand
    size: 900
    buckleOffset: 0, 2.65
    rotation: 0
    buckleOnInteractHand: false
    whitelist:
      requireAll: true
      components:
      - HumanoidAppearance
  - type: MovementSpeedModifier
    acceleration: 0
    friction: 5
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.6,-0.6,1.6,0.6"
        density: 100
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: N14MachineWaterTreatmentBroken
  id: N14SeismicMaterialExtractor
  name: seismic material extractor
  description: A battered pre-war drill that hammers the ground for usable raw materials. Its racket draws unwanted attention.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Machines/water_treatment.rsi
    state: watertreatment
  - type: PointLight
    enabled: false
    color: "#ff2020"
    radius: 3
    energy: 2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          N14SeismicMaterialExtractorBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # Balance: all economic tuning is here. Fuel belongs to the external generator
  # network; this machine only draws the listed powerLoad.
  - type: MaterialExtractor
    outputMinSeconds: 35
    outputMaxSeconds: 55
    playerActivationRadius: 30
    pulseIntervalSeconds: 5
    flavorIntervalSeconds: 30
    firstWaveMinSeconds: 120
    firstWaveMaxSeconds: 180
    waveMinSeconds: 150
    waveMaxSeconds: 210
    waveWarningSeconds: 20
    poorDepositChance: 0.25
    richDepositChance: 0.15
    poorYieldMultiplier: 0.7
    richYieldMultiplier: 1.4
    outputWeights:
      N14IronOre1: 20
      N14CopperOre1: 18
      N14LeadOre1: 14
      SulfurOre1: 12
      N14Sand1: 12
      Salt1: 10
      N14ZincOre1: 6
      N14BauxiteOre1: 5
      FertilizerOre1: 3
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: ExtensionCableReceiver
  - type: Storage
    grid:
    - 0,0,3,2
    maxItemSize: Normal
    clickInsert: false
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ActivatableUI
    key: enum.StorageUiKey.Key
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Tag
    tags:
    - Structure

- type: entity
  parent: N14MachineWaterTreatmentBroken
  id: N14SeismicMaterialExtractorBroken
  name: destroyed seismic material extractor
  description: The drill is silent. Its ruined hopper is full of twisted machinery.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Machines/water_treatment.rsi
    state: watertreatment_broken

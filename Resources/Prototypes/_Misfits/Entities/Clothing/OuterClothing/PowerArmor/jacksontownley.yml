# #Misfits Add - Jackson Townley personal set, re-sprayed NCR art.
# #Cythisiax Edited - rethemed from "Paladin Commander" to the Brotherhood Deserter set.
# Reskin of the Midwest Commander suit (parents directly off it, inheriting ALL
# Midwest Commander mechanics: Armor, ExplosionResistance, PowerArmorIntegrity,
# Reflect, WastelandMap HUD, ToggleableClothing, etc.). Only Sprite/Clothing
# paths are overridden, plus the ToggleableClothing head so toggling equips the
# custom helmet instead of the stock Midwest Commander helmet.
# Round-start spawn gear for the BoSPaladinCommander job (see bos_paladin_commander.yml).

- type: entity
  parent: N14ClothingOuterPowerArmorMidwestCommander
  id: N14ClothingOuterPowerArmorJacksontownley
  name: Jacksontownley Power Armor
  description: A personalized and highly customized abomination of Midwestern MK III ATA power armor.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/jacksontownley_pa.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/jacksontownley_pa.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: N14ClothingHeadHelmetPowerArmorJacksontownley # #Misfits Edited - custom helmet instead of stock Midwest Commander helmet
      gloves: N14ClothingPAGauntletsMBoS
      shoes: N14ClothingPABootsMBoS
      back: N14ClothingPowerSystemsBack

# #Misfits Add - Robb Wilkins personal Brotherhood of Steel set: "T-1F 'Tombstone'" power armor (sprites by enchantedcrocolisk and baohe).
# #Cythisiax Added - a prototype sealed within a salvaged cryopod — still part of the BoS.
# Reskin of the Midwest Commander suit (parents directly off it, inheriting ALL
# Midwest Commander mechanics: Armor, ExplosionResistance, PowerArmorIntegrity,
# Reflect, WastelandMap HUD, ToggleableClothing, etc.). Only Sprite/Clothing
# paths are overridden, plus the ToggleableClothing head so toggling equips the
# custom TOMBSTONE helmet instead of the stock Midwest Commander helmet.

- type: entity
  parent: N14ClothingOuterPowerArmorMidwestCommander
  id: N14ClothingOuterPowerArmorTombstone
  name: T-1F 'Tombstone'
  description: A prototype suit of power armour, built off the salvaged remains of a cryopod. A badge of devotion, Its wearer is hermetically sealed within, bound in frost and oath.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/tombstone_pa.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/tombstone_pa.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: N14ClothingHeadHelmetPowerArmorTombstone # #Misfits Edited - custom TOMBSTONE helmet instead of stock Midwest Commander helmet
      gloves: N14ClothingPAGauntletsMBoS
      shoes: N14ClothingPABootsMBoS
      back: N14ClothingPowerSystemsBack

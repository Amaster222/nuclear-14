# #Misfits Add - Prosthetic limb markings.
# Prosthetic limbs are selectable from the Appearance (Markings) tab under their own
# 'Prosthetics' category, kept separate from tattoos/marks. Each marking overlays the
# corresponding base limb sprite (bodyPart) with a prosthetic limb, following the same
# pattern forks use to overlay/replace the base urist sprite with prosthesis sprites.
#
# Wasteland sprites are converted from D:\host\misfits\sprites\misc sprites (Simple /
# Vault-Tec / NCR). NOTE: source art was authored at 64px and downscaled 2x to 32px; it
# is intentionally bulky and may need a dedicated SS14-scale redraw pass.
# Cyberlimb sprites reuse the existing Mobs/Customization/cyberlimbs RSIs.

- type: marking
  id: ProstheticWastelandArmLSimple
  bodyPart: LArm
  markingCategory: Prosthetics
  speciesRestriction: [Human, Ghoul]
  sprites:
  - sprite: _Misfits/Mobs/Customization/prosthetics.rsi
    state: arm_l_simple


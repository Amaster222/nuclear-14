  parent: [N14MobNightstalkerCub, N14MobMaterialExtractorWaveBase]

- type: entity
  id: N14MobMaterialExtractorNightstalkerWave
  parent: [N14MobNightstalker, N14MobMaterialExtractorWaveBase]

- type: entity
  id: N14MobMaterialExtractorRadMirelurkWave

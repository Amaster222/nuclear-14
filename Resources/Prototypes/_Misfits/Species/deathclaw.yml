# #Cythisiax Added - Deathclaw species: whitelisted playable species (unlocks like mutants/silicons).
# Dedicated Bwonsamdi body is used by the SentientDeathclaw job, which remains the species whitelist gate.

- type: species
  id: Deathclaw
  name: species-name-deathclaw
  roundStart: true # #Cythisiax - whitelisted players see it in the character editor species dropdown
  order: 5 # #Cythisiax - sorts just after Nightkin/C-27, before Robot variants
  whitelistRequired: true # #Cythisiax - full whitelist gate
  restrictedCustomization: true # #Cythisiax - non-humanoid: no markings/antag tabs
  allowedTraitCategories: # #Cythisiax - keep accent/language perks so they persist on save
  - Uncategorized
  - Auditory
  - Mental
  - Physical
  - Speech
  - TraitsSpeechUncategorized
  - TraitsSpeechAccents
  - TraitsSpeechLanguages
  - Visual
  - Language
  jobWhitelistUnlock: SentientDeathclaw # #Cythisiax - SentientDeathclaw whitelist unlocks this species
  restrictedJobs: # #Cythisiax - species can only take the SentientDeathclaw job
  - SentientDeathclaw
  prototype: N14MobDeathclawPlayer
  dollPrototype: N14MobDeathclawPlayer
  skinColoration: Hues
  defaultSkinTone: "#8b0000" # #Cythisiax - dark crimson (Bwonsamdi theme)
  # #Cythisiax - size sliders kept in the Appearance tab; default matches the in-game sprite (scale 1.0), can scale up for a bigger boss.
  minHeight: 1.0
  defaultHeight: 1.0
  maxHeight: 1.6
  minWidth: 0.9
  defaultWidth: 1.0
  maxWidth: 1.5
  averageHeight: 210
  averageWidth: 95
  sexes:
  - Unsexed
  markingLimits: DeathclawMarkingLimits # #Cythisiax - required valid points block (client MarkingSet indexes it; null crashes the lobby)
  sprites: DeathclawSprites # #Cythisiax - empty sprite set so no humanoid layers overlay the deathclaw preview

# Shared marking limits — deathclaws have no body markings but need a valid points block.
- type: markingPoints
  id: DeathclawMarkingLimits
  onlyWhitelisted: true
  points:
    Chest:
      points: 0
      required: false

# Shared sprite set — deathclaw uses its own Sprite component, so no humanoid layers needed.
- type: speciesBaseSprites
  id: DeathclawSprites
  sprites: {}

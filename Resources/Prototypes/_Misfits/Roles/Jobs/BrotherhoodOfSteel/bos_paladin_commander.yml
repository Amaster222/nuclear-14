# #Cythisiax Edited - "Brotherhood Deserter" personal-whitelist role (was "Paladin Commander").
# Single-player whitelist posting (ckey: southernsaint): a Paladin who turned their back on
# the Brotherhood of Steel. Now tags with the NCR at prisoner level, keeping the spoils of
# their former life — a re-sprited Midwest MK III ATA power armor suit and an AER-9.
# Job ID stays BoSPaladinCommander so the existing whitelist entry + playtime tracker are preserved.

- type: job
  id: BoSPaladinCommander
  setPreference: true
  whitelisted: true # #Cythisiax Added - requires an explicit job whitelist entry (jobwhitelistadd southernsaint BoSPaladinCommander)
  hideWithoutJobWhitelist: true # #Cythisiax Added - hidden from the job picker unless whitelisted for this job
  jobWhitelistBypassesRoleTimers: true
  weight: 111
  showBorder: true
  canBeAntag: false
  name: job-name-bos-deserter # #Cythisiax Edited - rethemed to "Brotherhood Deserter"
  overwatchCategory: OverwatchNcrCivilian # #Cythisiax Edited - NCR-aligned deserter tracked under NCR civilian overwatch
  description: job-description-bos-deserter # #Cythisiax Edited
  playTimeTracker: BoSPaladinCommander
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
  startingGear: BoSPaladinCommanderGear
  alwaysUseSpawner: true
  requireAdminNotify: true
  icon: "JobIconWastelander" # #Cythisiax Edited - deserter icon (was BoS Commander)
  supervisors: job-supervisors-bos-deserter # #Cythisiax Edited
  access:
  - NCR # #Cythisiax Edited - prisoner-level NCR access (was BOSHeadPaladin)
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR
      - type: PowerArmorProficiency
      - type: LanguageKnowledge
        speaks:
        - English
        understands:
        - English
        - N14BrotherBeep

# #Cythisiax Edited - Deserter kit: re-sprited Midwest MK III ATA power armor, NCR prisoner
# dogtags, NCR headset, and an AER-9 (BoS Pip-Boy/holotag/headset/kit removed).
- type: startingGear
  id: BoSPaladinCommanderGear
  equipment:
    jumpsuit: M14ClothingUniformDesertersNCRUniform # #Cythisiax Edited - disheveled NCR fatigues (deserter)
    back: N14ClothingBackpackMilitary
    shoes: N14ClothingBootsLeatherFilled
    head: N14ClothingHeadHelmetPowerArmorJacksontownley # #Cythisiax Edited - re-sprited MK III ATA helmet (was BoS beret)
    outerClothing: N14ClothingOuterPowerArmorJacksontownley # #Cythisiax Edited - re-sprited Midwest MK III ATA (identical stats)
    hands: N14ClothingHandsGlovesCombat
    id: N14IDNCRDogtagPrisoner # #Cythisiax Edited - NCR dog tags on prisoner level
    ears: N14ClothingHeadsetNCR # #Cythisiax Edited - NCR headset (was BoS headset)
    belt: N14ClothingBeltBoSWebbing
  storage:
    back:
    - N14BoxPlasticFilledMilitary
    - N14WeaponLaserRifleAuto # #Cythisiax Edited - AER-9 auto laser rifle
    - N14MicrofusionCell
    - N14MicrofusionCell
    - N14MicrofusionCell

- type: playTimeTracker
  id: BoSPaladinCommander
